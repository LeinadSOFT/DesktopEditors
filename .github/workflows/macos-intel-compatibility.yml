name: Inspect Nextcloud Intel macOS compatibility

on:
  workflow_dispatch:
  push:
    branches: [macos-intel]
    paths:
      - '.github/workflows/macos-intel-compatibility.yml'
      - 'build/macos-compatibility/**'

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nextcloud-office-intel-x86_64-unofficial
          run-id: 41044816146
          github-token: ${{ github.token }}
          path: input
      - name: Check macOS minimums of every native binary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nextcloud-intel" report
          trap 'hdiutil detach "$RUNNER_TEMP/nextcloud-intel"' EXIT
          DMG='input/Nextcloud-Office-DesktopEditors-9.3.6-intel.1-macos-x86_64.dmg'
          hdiutil verify "$DMG"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/nextcloud-intel"
          APP="$RUNNER_TEMP/nextcloud-intel/Nextcloud Office.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          python3 build/macos-compatibility/check.py "$APP" report/macos-compatibility.json
          cat report/macos-compatibility.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nextcloud-intel-macos-compatibility
          path: report/
          if-no-files-found: error
